name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run test suite
        run: uv run pytest -q --tb=short

  package:
    name: Build and packaging smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build distributions
        run: uv build

      - name: Assert artifacts exist
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path("dist")
          wheels = list(dist.glob("forge_scaffolder-*.whl"))
          sdists = list(dist.glob("forge_scaffolder-*.tar.gz"))
          assert wheels, f"no wheel in {list(dist.iterdir())}"
          assert sdists, f"no sdist in {list(dist.iterdir())}"
          print("artifacts:", *(p.name for p in wheels + sdists))
          PY

      - name: Verify wheel templates
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("forge_scaffolder-*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              metadata = zf.read(next(n for n in names if n.endswith(".dist-info/METADATA"))).decode()
          assert "Name: forge-scaffolder" in metadata
          assert "Version: 0.2.0" in metadata
          templates = [n for n in names if n.startswith("forge/templates/python/")]
          assert templates, "missing forge/templates/python in wheel"
          for framework in ("fastapi", "django", "flask"):
              assert any(f"/{framework}/" in n for n in templates), framework
          assert any(n.endswith("mongodb.py.j2") for n in templates)
          assert any(n.endswith("redis_client.py.j2") for n in templates)
          assert any(
              "/_shared/" in n and n.endswith("ci.yml.j2") for n in templates
          ), "missing shared GitHub Actions CI template"
          assert any(
              "/_shared/" in n and n.endswith(".env.example.j2") for n in templates
          )
          assert any(
              "/_includes/" in n and n.endswith("readme_macros.j2") for n in templates
          )
          assert not any(".cursor" in n for n in names)
          assert not any(".smoke" in n for n in names)
          print(f"templates packaged: {len(templates)}")
          PY

      - name: Pytest packaging markers
        run: uv run pytest -q -m packaging --tb=short

      - name: Pytest generation smoke
        run: uv run pytest -q -m generation_smoke --tb=short

      - name: Packaging smoke (clean install)
        run: bash scripts/packaging_smoke.sh
